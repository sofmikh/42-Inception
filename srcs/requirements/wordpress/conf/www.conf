; PHP-FPM pool configuration for WordPress
; PHP-FPM manages a pool of PHP worker processes
; NGINX sends PHP requests here via the FastCGI protocol

[www]

; Run PHP workers as www-data (same user that owns the WordPress files)
user  = www-data
group = www-data

; Listen on all interfaces on port 9000
; NGINX will connect using "wordpress:9000" (Docker DNS resolves the container name)
listen = 0.0.0.0:9000

; Socket permissions (used when listen is a socket path, kept for compatibility)
listen.owner = www-data
listen.group = www-data

; Dynamic process management:
; PHP-FPM starts some workers and scales up/down based on traffic
pm                   = dynamic
pm.max_children      = 5   ; maximum number of PHP worker processes
pm.start_servers     = 2   ; workers started at boot
pm.min_spare_servers = 1   ; minimum idle workers
pm.max_spare_servers = 3   ; maximum idle workers

; Pass environment variables from the container to PHP
; Needed so WordPress can read DB credentials from environment
clear_env = no
