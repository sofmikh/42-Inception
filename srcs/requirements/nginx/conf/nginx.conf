# NGINX virtual host configuration for Inception
# This server block handles HTTPS traffic only on port 443

server {
    # Listen on port 443 with SSL for both IPv4 and IPv6
    # Port 80 is not configured: HTTP access is intentionally blocked
    listen      443 ssl;
    listen      [::]:443 ssl;

    # Domain name (must match the DOMAIN_NAME env variable)
    server_name smikhail.42.fr;

    # Self-signed TLS certificate generated at startup by setup.sh
    ssl_certificate     /etc/ssl/certs/inception.crt;
    ssl_certificate_key /etc/ssl/private/inception.key;

    # Only allow TLS 1.2 and TLS 1.3 (required by the subject)
    # Older versions (SSLv3, TLS 1.0, TLS 1.1) are disabled for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # WordPress files are served from this directory
    # This path is shared with the WordPress container via a Docker volume
    root  /var/www/html;
    index index.php index.html;

    # WordPress permalink support:
    # Try to serve the file directly, then as a directory,
    # otherwise pass to WordPress's front controller (index.php)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass all PHP file requests to PHP-FPM running in the WordPress container
    # "wordpress" is the service name in docker-compose
    # Docker's internal DNS resolves "wordpress" to the container IP automatically
    location ~ \.php$ {
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   wordpress:9000;
    }

    # Block access to hidden files (e.g. .htaccess, .env)
    location ~ /\. {
        deny all;
    }
}
